<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTOP-3D 模組檢查</title>
<style>
body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#0c1822;color:#eef6fb;padding:24px}
.card{max-width:760px;margin:auto;padding:22px;border:1px solid #31566d;border-radius:14px;background:#122836}
.ok{color:#55da8b}.bad{color:#ff7c73}pre{white-space:pre-wrap;word-break:break-word;background:#08131c;padding:12px;border-radius:8px}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="card">
<h1>UTOP-3D 模組檢查</h1>
<div id="result">檢查Three.js中……</div>
</div>
<script type="module">
const result=document.getElementById('result');
try{
  const THREE=await import('three');
  const controls=await import('three/addons/controls/OrbitControls.js');
  result.innerHTML=
    '<p class="ok">✓ Three.js 載入成功</p>'+
    '<p class="ok">✓ OrbitControls 載入成功</p>'+
    '<pre>Three REVISION: '+THREE.REVISION+'\nOrbitControls: '+typeof controls.OrbitControls+'</pre>';
}catch(error){
  result.innerHTML='<p class="bad">✗ 3D模組載入失敗</p><pre>'+String(error.stack||error)+'</pre>';
}
</script>
</body>
</html>
